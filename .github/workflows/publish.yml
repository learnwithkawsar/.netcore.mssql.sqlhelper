name: Publish to NuGet

# Runs when a version tag such as v2.0.0 is pushed.
# Uses NuGet trusted publishing (GitHub OIDC), so no long-lived API key is stored.
# Requires:
#   - a trusted publishing policy on nuget.org for this repository and workflow file (publish.yml)
#   - a repository secret NUGET_USER holding the nuget.org username (profile name, not email)
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: Core.MSSQL.SqlHelper/Core.MSSQL.SqlHelper.csproj

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets the job request a GitHub OIDC token for NuGet login

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Check tag matches project version
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Run this workflow from a version tag (e.g. v2.0.0), not from branch $GITHUB_REF_NAME"
            exit 1
          fi
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(dotnet msbuild "$PROJECT" -getProperty:Version)"
          echo "Tag version:     $TAG_VERSION"
          echo "Project version: $PROJECT_VERSION"
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match <Version>$PROJECT_VERSION</Version> in $PROJECT"
            exit 1
          fi

      - name: Check NuGet user is configured
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::Repository secret NUGET_USER (your nuget.org username) is not set"
            exit 1
          fi

      - name: Restore
        run: dotnet restore Core.MSSQL.SqlHelper.sln

      - name: Build
        run: dotnet build Core.MSSQL.SqlHelper.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Core.MSSQL.SqlHelper.sln --configuration Release --no-build

      - name: Pack
        run: dotnet pack "$PROJECT" --configuration Release --no-build --output artifacts

      # Requested right before the push: the temporary API key is valid for 1 hour.
      - name: NuGet login (OIDC to temporary API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: artifacts/*.nupkg
